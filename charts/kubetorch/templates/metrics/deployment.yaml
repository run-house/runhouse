{{- if .Values.metrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubetorch-metrics
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubetorch-metrics
  template:
    metadata:
      labels:
        app: kubetorch-metrics
        {{- with .Values.kubetorchConfig.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.kubetorchConfig.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: kubetorch-metrics

      {{- with .Values.kubetorchConfig.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.kubetorchConfig.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}

      {{- if or .Values.kubetorchConfig.affinity .Values.metrics.affinity .Values.metrics.podAntiAffinity.enabled }}
      affinity:
        {{- with .Values.kubetorchConfig.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.metrics.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "kubetorch.podAntiAffinity" (dict "component" "kubetorch-metrics" "config" .Values.metrics.podAntiAffinity) | nindent 8 }}
      {{- end }}

      {{- if or .Values.kubetorchConfig.nodeSelector .Values.metrics.nodeSelector }}
      nodeSelector:
        {{- with .Values.kubetorchConfig.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.metrics.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      {{- if or .Values.kubetorchConfig.tolerations .Values.metrics.tolerations }}
      tolerations:
        {{- with .Values.kubetorchConfig.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.metrics.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      containers:
        - name: prometheus
          image: {{ .Values.metrics.prometheus.image }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.metrics.prometheus.retention }}"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: {{ .Values.metrics.prometheus.port }}
          resources:
            requests:
              cpu: {{ .Values.metrics.prometheus.resources.cpu }}
              memory: {{ .Values.metrics.prometheus.resources.memory }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            # Add CA certificates so HTTPS to kubernetes.default.svc works
            - name: k8s-ca-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            {{- if and .Values.metrics.prometheus.remoteWrite.enabled .Values.metrics.prometheus.remoteWrite.basicAuthSecret }}
            - name: remote-write-auth
              mountPath: /etc/prometheus/secrets
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: kubetorch-metrics-config
        # Mount the cluster's CA cert (auto-created ConfigMap)
        - name: k8s-ca-certs
          projected:
            sources:
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca-certificates.crt
        {{- if and .Values.metrics.prometheus.remoteWrite.enabled .Values.metrics.prometheus.remoteWrite.basicAuthSecret }}
        - name: remote-write-auth
          secret:
            secretName: {{ .Values.metrics.prometheus.remoteWrite.basicAuthSecret }}
        {{- end }}
{{- end }}
